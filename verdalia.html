let AC=null,musicMuted=false;
let masterGain=null,compressor=null;

function bootAudio(){
  if(!AC){
    try{
      AC=new (window.AudioContext||window.webkitAudioContext)();
      initAudioGraph();
    }catch(e){return false}
  }
  if(AC.state==='suspended')AC.resume();
  return true;
}
function userGesture(){bootAudio();kickMusic()}
addEventListener('keydown',userGesture);
addEventListener('pointerdown',userGesture);
addEventListener('touchstart',userGesture,{passive:true});

function initAudioGraph(){
  if(masterGain)return;
  masterGain=AC.createGain();
  masterGain.gain.value=.9;
  compressor=AC.createDynamicsCompressor();
  compressor.threshold.value=-24;
  compressor.knee.value=12;
  compressor.ratio.value=4;
  compressor.attack.value=.003;
  compressor.release.value=.25;
  masterGain.connect(compressor);
  compressor.connect(AC.destination);
}

function sfx(f,d=.08,t='square',v=.04){
  if(!bootAudio())return;
  try{
    const o=AC.createOscillator(),g=AC.createGain();
    o.type=t;o.frequency.value=f;
    g.gain.setValueAtTime(v,AC.currentTime);
    g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+d);
    o.connect(g);g.connect(masterGain);
    o.start();o.stop(AC.currentTime+d);
  }catch(e){}
}

/* ═══════════════ TRILHA SONORA — arquivos de áudio em loop ═══════════════
   Os arquivos .mp3 ficam na MESMA PASTA deste HTML.
   Para trocar qual faixa toca em cada parte do jogo, edite trackForLevel() e updateMusic(). */
const TRACKS={
  menu:    {src:'audio_menu_introducao.mp3',  vol:.8},  /* menu principal, dificuldade, introdução, vila */
  floresta:{src:'audio_floresta.mp3',         vol:.8},  /* níveis 1–100 */
  rio:     {src:'audio_rio_campos.mp3',       vol:.8},  /* níveis 101–300 */
  ceu:     {src:'audio_ceu_mar_minas.mp3',    vol:.8},  /* níveis 301–600 (e 601–999, que não têm faixa própria) */
  coracao: {src:'audio_coracao_ferrugem.mp3', vol:.8}   /* nível 1000 — chefe final */
};
function trackForLevel(n){return n>=1000?'coracao':n<=100?'floresta':n<=300?'rio':'ceu'}

let MV=.8;try{const v=parseFloat(localStorage.getItem('vd_mvol'));if(isFinite(v))MV=Math.max(0,Math.min(1,v))}catch(e){}
function setMV(v){MV=Math.max(0,Math.min(1,Math.round(v*20)/20));try{localStorage.setItem('vd_mvol',MV)}catch(e){}}
const volBar=()=>'◀ '+'█'.repeat(Math.round(MV*10))+'░'.repeat(10-Math.round(MV*10))+' '+Math.round(MV*100)+'% ▶';
let volSel=false;   /* true quando o cursor da pausa está no item de volume (não abaixa a música para dar pra ouvir) */
const AUD={};let curTrack='',audioBlocked=false;
function getAud(name){
  let a=AUD[name];if(a)return a;
  a=new Audio();a.preload='auto';a.loop=true;a.volume=0;a.src=TRACKS[name].src;
  a.addEventListener('error',()=>{if(!a._bad){a._bad=1;toast('Áudio não encontrado: '+TRACKS[name].src)}});
  AUD[name]=a;return a;
}
function setMusic(name){
  if(curTrack===name||!TRACKS[name])return;
  curTrack=name;getAud(name);
}
function kickMusic(){
  for(const n in AUD)AUD[n]._t=0;
  const a=AUD[curTrack];
  if(a&&a.paused&&!a._bad&&!musicMuted){try{a.play().then(()=>{audioBlocked=false}).catch(()=>{})}catch(e){}}
}
/* roda todo quadro: faz fade-in/fade-out entre as faixas e liga/desliga o play */
function musicStep(){
  const now=performance.now(),duck=(sc==='pause'&&!volSel)?.45:1;
  for(const name in AUD){
    const a=AUD[name];
    const tv=(name===curTrack&&!musicMuted&&!document.hidden)?MV*duck:0;
    const r=.012,dv=tv-a.volume;
    a.volume=Math.max(0,Math.min(1,a.volume+Math.max(-r,Math.min(r,dv))));
    if(tv>0&&a.paused&&!a._bad){
      if(!a._t||now-a._t>400){
        a._t=now;
        try{const pr=a.play();if(pr&&pr.then)pr.then(()=>{audioBlocked=false}).catch(err=>{if(err&&err.name==='NotAllowedError')audioBlocked=true})}catch(e){}
      }
    }else if(tv===0&&a.volume<=.002&&!a.paused){a.pause();a.currentTime=0}
  }
}
document.addEventListener('visibilitychange',()=>{if(document.hidden)for(const n in AUD)AUD[n].pause();else kickMusic()});
getAud('menu');   /* já começa a baixar a faixa do menu */

function updateMusic(){
  let target='';
  if(sc==='title'||sc==='diff'||sc==='town')target='menu';

/* ── Controles: até 4. Cada controle ganha um slot (P1..P4) quando conecta e o mantém
      até desconectar, então desligar o controle do P2 não troca o P3 de lugar. ── */
const padSlot=new Map();            /* gamepad.index -> slot 0..3 */
let GP=[null,null,null,null];
addEventListener('gamepadconnected',()=>pollPads());
addEventListener('gamepaddisconnected',()=>pollPads());
function pollPads(){
  let gs=[];try{gs=navigator.getGamepads?navigator.getGamepads():[]}catch(e){}
  const seen=new Set();
  for(const q of gs)if(q&&q.connected)seen.add(q.index);
  for(const [idx,sl] of [...padSlot]){if(!seen.has(idx)){padSlot.delete(idx);toast('Controle do P'+(sl+1)+' desconectado')}}
  for(const q of gs){
    if(!q||!q.connected||padSlot.has(q.index))continue;
    const used=new Set(padSlot.values());let sl=-1;
    for(let i=0;i<4;i++)if(!used.has(i)){sl=i;break}
    if(sl<0)continue;               /* já há 4 controles */
    padSlot.set(q.index,sl);toast('Controle conectado: P'+(sl+1)+' 🎮');
  }
  GP=[null,null,null,null];
  for(const q of gs)if(q&&q.connected&&padSlot.has(q.index))GP[padSlot.get(q.index)]=q;
}
function readPad(p,s){
  const b=i=>!!(p.buttons[i]&&p.buttons[i].pressed),ax=p.axes[0]||0,ay=p.axes[1]||0;
  if(ax<-.35||b(14))s.l=1;
  if(ax>.35||b(15))s.r=1;
  if(b(0))s.j=1;
  if(b(0))s.e=1;
  if(b(12)||ay<-.55)s.mu=1;      /* cima nos menus e na vila (direcional ou analógico) */
  if(ay>.5||b(13))s.dn=1;
  if(b(2))s.a=1;
  if(b(4))s.h=1;
  if(b(3))s.s=1;
  if(b(7)||b(5))s.u=1;
  if(b(6))s.g=1;
  if(b(9))s.p=1;
  if(b(8))s.m=1;
  if(b(1))s.b=1;
  if(b(10))s.y=1;
  if(b(11))s.t=1;
}
let curS=[{},{},{},{}],prevS=[{},{},{},{}],prs=[new Set(),new Set(),new Set(),new Set()];
let clickConfirm=0;
function input(){
  pollPads();
  const s=[{},{},{},{}];
  const kbJump=!!(KB.j||KP.j);
  for(const k in KB)if(KB[k]||KP[k])s[0][k]=1;
  for(const k in KP)delete KP[k];
  for(let i=0;i<4;i++)if(GP[i])readPad(GP[i],s[i]);
  if(kbJump)s[0].mu=1;   /* só teclado: ↑/W/Espaço também sobem nos menus */
  if(clickConfirm){s[0].e=1;clickConfirm=0;}
  for(let i=0;i<4;i++){
    prs[i].clear();const c=s[i],pv=prevS[i];
    for(const k in c)if(c[k]&&!pv[k])prs[i].add(k);
    prevS[i]=Object.assign({},c);
  }
  curS=s;
}
const dn=(i,k)=>!!curS[i][k];
const jp=(i,k)=>prs[i].has(k);
/* "qualquer jogador apertou k" (P1 = teclado/controle 1; P2–P4 só se tiverem controle) */
const anyDn=k=>{for(let i=0;i<4;i++)if((i===0||GP[i])&&dn(i,k))return true;return false};
function volKeys(){   /* ◀ ▶ ajusta o volume (segurando repete) */
  if(anyJp('r')||(anyDn('r')&&T%6===0))setMV(MV+.05);
  if(anyJp('l')||(anyDn('l')&&T%6===0))setMV(MV-.05);
}
const anyJp=k=>{for(let i=0;i<4;i++)if((i===0||GP[i])&&jp(i,k))return true;return false};
/* entrada/saída de jogadores no meio da fase */
function syncPlayers(){
  for(let i=1;i<4;i++){
    if((GP[i]||forcedP(i))&&!PS[i]){
      const ref=PS.find(q=>q&&q.hp>0)||PS[0];
      const np=mkPlayer(i);np.x=ref.x;np.y=ref.y-10;np.inv=120;PS[i]=np;
      toast('P'+(i+1)+' entrou!');
    }else if(!GP[i]&&!forcedP(i)&&PS[i]){PS[i]=null;cl[i]=null}
  }
  pl=PS[0];pl2=PS[1];pl3=PS[2];pl4=PS[3];
}

    up:{hp:0,cr:0,pw:0,dm:0,sa:0},
    inv:{el:0,es:0,to:0},
    powers:{}, mskin:0
  };
}
function newSave(){
  return {
    ver:4, created:0, diff:-1, lv:1, mx:1,
    aq:[], qi:0, st:{k:0,o:0,l:0,b:0,c:0,u:0},
    p1:newProfile(), p2:newProfile(), p3:newProfile(), p4:newProfile(),
    town:null, finished:0
  };
}
let G=newSave();
const profOf=i=>i===0?G.p1:i===1?G.p2:i===2?G.p3:G.p4;
function loadSave(){
  try{
    const raw=localStorage.getItem('vd3');
    if(!raw)return;
    const o=JSON.parse(raw);
    G=newSave();
    G.created=o.created||0;
    G.diff=(o.diff!==undefined)?o.diff:-1;
    G.lv=o.lv||1;
    G.mx=o.mx||1;
    G.aq=o.aq||[];
    G.qi=o.qi||0;
    G.st=Object.assign({k:0,o:0,l:0,b:0,c:0,u:0},o.st||{});
    G.town=o.town||null;
    G.finished=o.finished||0;
    if(o.ver===4&&o.p1&&o.p2){
      G.p1=Object.assign(newProfile(),o.p1);
      G.p2=Object.assign(newProfile(),o.p2);
      G.p3=o.p3?Object.assign(newProfile(),o.p3):newProfile();
      G.p4=o.p4?Object.assign(newProfile(),o.p4):newProfile();
    } else {
      const p1=newProfile();
      p1.coins=o.coins||0;p1.own=o.own||{};
      p1.eq=Object.assign({sk:0,wp:0,ac:-1,au:-1},o.eq||{});
      p1.up=Object.assign({hp:0,cr:0,pw:0,dm:0,sa:0},o.up||{});
      p1.inv=Object.assign({el:0,es:0,to:0},o.inv||{});

function mhp(i){
  const pr=profOf(i);
  let v=5+(pr.up.hp||0);
  if(pr.powers[4])v+=3;
  if(pr.powers[9])v+=2;
  if(pr.mskin)v+=1;
  return v;
}
function coinMult(i){
  const pr=profOf(i);
  return DS().g*(pr.mskin?3:1);
}
function gain(n){
  for(let i=0;i<4;i++)profOf(i).coins+=Math.round(n*coinMult(i));
  cf=18;save();
}
function inc(k,n){
  G.st[k]=(G.st[k]||0)+n;
  for(let j=0;j<G.aq.length;j++){
    const q=G.aq[j],d=QS[q.i];
    if(d[1]===k&&G.st[k]-q.b>=d[2]){
      gain(d[3]);sndQuest();toast('Missão: '+d[0]+'  +'+d[3]+' ◆');
      if(G.qi<QS.length){const z=QS[G.qi];G.aq[j]={i:G.qi++,b:G.st[z[1]]||0}}else G.aq.splice(j--,1);
    }
  }
}
function checkPowers(){
  let anyNew=false,lastName='';
  for(let i=0;i<10;i++){
    const need=(i+1)*100;
    if(G.mx>=need){
      for(let j=0;j<4;j++){
        const pr=profOf(j);
        if(!pr.powers[i]){pr.powers[i]=1;anyNew=true;lastName=POWERS[i].n}
      }
    }
  }

    msg={t:'NOVO PODER DESPERTADO',a:lastName+'\n\nOs jogadores recebem o poder.',u:'Um marco de nível foi atingido.'};

}

let wx='rain',wq=[],lf=0;
const WD={rain:[-3,17,'#b8d4ff',0],storm:[-9,24,'#9fb8ee',0],snow:[-.7,2,'#fff',1],
  ash:[-.6,1.3,'#b9b3ac',1],dust:[-2.5,.3,'#e0c890',1],sand:[-18,1,'#e2b86a',0],
  fog:[-.4,0,'#dfeee8',1],smoke:[.4,-1.4,'#3a3a40',1]};
function wxInit(w){wx=w;wq=[];const n=w==='fog'?30:130;for(let i=0;i<n;i++)wq.push({x:Math.random()*VW,y:Math.random()*VH,z:Math.random()})}
function wxStep(){
  const d=WD[wx];if(!d)return;
  for(const p of wq){const k=.6+p.z*.8;p.x+=d[0]*k+(d[3]?Math.sin(T/30+p.z*9)*.4:0);p.y+=d[1]*k;
    if(p.y>VH)p.y=-10;if(p.y<-10)p.y=VH;if(p.x<-20)p.x=VW+10;if(p.x>VW+20)p.x=-10}
  if(wx==='storm'&&Math.random()<.004){lf=1;sfx(60,.4,'sawtooth',.05)}lf*=.9;
}
function wxDraw(){
  const d=WD[wx];if(!d)return;
  const h={fog:'rgba(210,225,220,.14)',sand:'rgba(210,165,80,.2)',smoke:'rgba(20,20,26,.22)',
    storm:'rgba(20,30,50,.2)',ash:'rgba(60,55,50,.1)'}[wx];
  if(h){X.fillStyle=h;X.fillRect(0,0,VW,VH)}
  X.strokeStyle=X.fillStyle=d[2];
  for(const p of wq){
    X.globalAlpha=wx==='fog'?.05:.25+p.z*.5;X.beginPath();
    if(d[3]){X.arc(p.x,p.y,wx==='fog'?30+p.z*40:1+p.z*(wx==='smoke'?4:2),0,7);X.fill()}
    else{X.lineWidth=1+p.z;X.moveTo(p.x,p.y);X.lineTo(p.x+d[0]*1.6,p.y+d[1]*1.6);X.stroke()}
  }
  X.globalAlpha=1;
  if(lf>.05){X.fillStyle=`rgba(230,240,255,${lf*.5})`;X.fillRect(0,0,VW,VH)}
}
function burst(x,y,n,c,s){for(let i=0;i<n;i++)pt.push({x,y,vx:(Math.random()-.5)*s*2,vy:(Math.random()-.8)*s*2,l:30+Math.random()*20,m:50,c,s:2+Math.random()*3})}

function addCh(p,n){p.ch=Math.min(100,p.ch+n*(1+.35*(p.prof.up.cr||0)))}
function ult(p){
  pp.push({x:p.x+p.f*30,y:p.y,vx:p.f*12,vy:0,
    d:(6+4*(p.prof.up.pw||0))*(p.prof.powers[7]?2:1),
    r:(44)*(p.prof.powers[7]?1.6:1),l:80,w:1,u:1,owner:p});

}
function hurt(p,sx,nb){
  if(!p||p.inv>0||p.hp<=0)return;
  if(p.bk&&!nb&&(sx-p.x)*p.f>=-6){
    if(p.gb<=12){addCh(p,8);burst(p.x+p.f*16,p.y,14,'#fff',5);sfx(900,.12,'sine',.06);shake=4;hs=4;rum(70,.3,.3);p.inv=20;return}
    else{p.gd=Math.max(0,p.gd-28);p.vx=-p.f*3;burst(p.x+p.f*16,p.y,8,'#9cf',3);sfx(240,.08,'square');p.inv=18;return}
  }
  if(p.sh>0){p.sh--;p.inv=40;burst(p.x,p.y,12,'#7fe0ff',4);sfx(300,.1,'sine');rum(80,.3,.2);return}
  p.hp--;rum(160,.7,.4);p.inv=80;p.vx=(p.x<sx?-1:1)*7;p.vy=-7;
  shake=10;hs=6;burst(p.x,p.y,14,'#fff',5);sfx(90,.2,'sawtooth',.08);
  if(p.prof.powers[3])tSlow=60;
  if(p.hp<=0){
    if(p.prof.powers[8]&&!p.revived){p.revived=1;p.hp=3;p.inv=120;burst(p.x,p.y,50,'#ffd27a',8);sfx(500,.5,'sine',.1);toast('RENASCIMENTO!');return}
    burst(p.x,p.y,50,'#9ef0b0',7);sfx(50,.5,'sawtooth',.1);
  }
}
function hit(e,d,src){
  if(!src)src=pl;
  const atkProf=src.prof;
  if(e!==bs&&e.t===6&&d<5&&Math.sign(src.x-e.x)===e.f){
    e.fl=3;burst(e.x+e.f*16,e.y,5,'#9cf',3);sfx(520,.05,'square');return;
  }
  if(e===bs&&bs.fin){d=src.el?2:1}   /* chefe final: cada golpe = 1 (2 com o Elixir da Fúria), sem multiplicadores */
  else{
    if(e===bs&&src.el)d*=2;
    if(atkProf.mskin)d*=3;
    if(atkProf.powers[9])d*=1.5;
  }
  e.hp-=d;e.fl=5;
  if(e!==bs)e.vx+=src.f*5;
  src.sv=Math.min(99,src.sv+10+3*(atkProf.up.sa||0));
  burst(e.x,e.y,6,'#ffd27a',4);sfx(160,.05,'sawtooth');shake=Math.max(shake,3);hs=2;
  if(atkProf.powers[0]){
    burst(e.x,e.y,14,'#ffe9a8',5);
    for(const o of en)if(o!==e&&Math.hypot(o.x-e.x,o.y-e.y)<70)o.hp-=Math.max(1,d*0.35);
  }
  if(atkProf.powers[5]){
    let c=0;
    for(const o of en)if(o!==e&&c<3&&Math.hypot(o.x-e.x,o.y-e.y)<160){
      o.hp-=Math.max(1,d*0.5);c++;burst(o.x,o.y,4,'#9fffd0',3);
    }
  }
}
function swing(p){
  const wp=WEAPONS[p.prof.eq.wp]||WEAPONS[0];
  const rc=62+(bk>=3?22:0)+wp.rng,x0=p.f>0?p.x:p.x-rc;
  const d=(1+(bk>=3)+(bk>=7)+wp.dmg+(p.prof.up.dm||0)*2)*(p.prof.powers[9]?1.5:1);
  const tg=bs?[...en,bs]:en;
  for(const e of tg){
    const w=e===bs?bs.w/2:20,h=e===bs?bs.h/2:20;
    if(e.x+w>x0&&e.x-w<x0+rc&&Math.abs(e.y-p.y)<h+24+(e===bs&&bs.fly?36:0))hit(e,d,p);
  }
  for(const q of pj)if(q.x>x0&&q.x<x0+rc&&Math.abs(q.y-p.y)<40){q.l=0;burst(q.x,q.y,5,'#9f9',3)}
}
function upPlayer(p,idx){
  if(!p||p.hp<=0)return;
  const ax=(dn(idx,'r')?1:0)-(dn(idx,'l')?1:0);
  if(p.inv>0)p.inv--;if(p.dc>0)p.dc--;

function wr(s,x,y,w,z,lh,a=1){
  X.globalAlpha=a;X.fillStyle='#e8f5e9';X.shadowColor='#000';X.shadowBlur=8;
  X.textAlign='center';X.font=z+'px Georgia,serif';

  wr(msg.a,VW/2,190,Math.min(600,VW-80),17,26);
  wr(msg.u,VW/2,300,Math.min(600,VW-80),16,24,.95,'#9ef0b0');
  tx('Z / Enter  (A no controle)',VW/2,VH-60,13,'center',.5+Math.sin(T/15)*.4);
}
let ec=0;
function endDraw(){
  const a=Math.min(1,(ec-.3)*2);
  X.fillStyle='rgba(4,10,8,.9)';X.fillRect(0,0,VW,VH);
  glow(VW/2,VH/2,320,130,80,60,.3*a);
  tx('O mundo está curado',VW/2,110,34,'center',a,'#ffe9a8');
  wr('O Devorador Primordial caiu. Do Coração de Ferrugem brotou uma árvore imensa: os rios voltaram a correr, as florestas renasceram e o mar respira limpo. Mas Verdália só continua viva se nós também cuidarmos dela: consumir com consciência, reciclar, poupar água e plantar.',
     VW/2,170,Math.min(640,VW-80),16,26,a);
  if(ec>=1)tx('Z / Enter — viver em Verdália',VW/2,VH-50,15,'center',.5+Math.sin(T/15)*.4);
}
const TS=26,TW=46,TH=32;
let town=null;
function initTown(){
  if(G.town){town=G.town;return}
  town={px:TW*TS/2,py:TH*TS/2,vx:0,vy:0,f:1,anim:0,day:1,coins:G.p1.coins||0,
    npcs:[
      {x:12*TS,y:10*TS,n:'Lumi',c:'#9ef0b0',d:['Lumi: Você conseguiu, Sylo. O mundo respira de novo.','Lumi: Aqui você pode plantar, colher e viver em paz.','Lumi: Cada semente plantada é uma promessa cumprida.']},
      {x:22*TS,y:8*TS,n:'Ferreiro',c:'#e0a060',d:['Ferreiro: Trouxe minhas ferramentas de volta!','Ferreiro: Quer trocar suas colheitas por moedas? Volte sempre.']},
      {x:8*TS,y:18*TS,n:'Fazendeira',c:'#ffd76b',d:['Fazendeira: O solo está vivo outra vez!','Fazendeira: Plante, regue e espere. A terra recompensa a paciência.']},
      {x:30*TS,y:20*TS,n:'Criança',c:'#8fc4ff',d:['Criança: As estrelas voltaram! Você viu?','Criança: Quando eu crescer, quero ser Guardião também!']},
      {x:34*TS,y:12*TS,n:'Ancião',c:'#c9a8ff',d:['Ancião: Vi o mundo morrer e renascer.','Ancião: Cuidar é o único poder que nunca se esgota.']}
    ],plots:[],inv:{seeds:8,crops:0},msg:null,msgT:0};
  for(let i=0;i<8;i++)town.plots.push({x:(6+i)*TS,y:24*TS,state:0,grow:0});
  G.town=town;
}
function townStep(){
  if(!town)initTown();
  const p=town;
  const ax=(dn(0,'r')?1:0)-(dn(0,'l')?1:0),ay=(dn(0,'dn')?1:0)-(dn(0,'mu')?1:0),sp=2.4;
  p.vx+=(ax*sp-p.vx)*.25;p.vy+=(ay*sp-p.vy)*.25;
  p.px=Math.max(TS,Math.min(TW*TS-TS,p.px+p.vx));
  p.py=Math.max(TS,Math.min(TH*TS-TS,p.py+p.vy));
  if(ax)p.f=ax;p.anim+=Math.hypot(p.vx,p.vy)*0.12;
  if(p.msgT>0)p.msgT--;
  if(anyJp('p')){G.town=town;save();sc='title';sndMenuBack();return}
  if(jp(0,'e')||jp(0,'a')){
    for(const n of p.npcs){
      if(Math.hypot(n.x-p.px,n.y-p.py)<48){
        p.msg=n.d[(Math.random()*n.d.length)|0];p.msgT=240;sfx(600,.1,'sine',.03);return;
      }
    }
    for(const q of p.plots){
      if(Math.hypot(q.x-p.px,q.y-p.py)<40){
        if(q.state===0&&p.inv.seeds>0){q.state=1;q.grow=0;p.inv.seeds--;sfx(500,.1,'sine',.03);p.msg='Semente plantada!';p.msgT=120}
        else if(q.state===1){q.grow+=1;p.msg='Regada. ('+q.grow+'/3)';p.msgT=90;if(q.grow>=3){q.state=2;p.msg='Pronto para colher!';p.msgT=120}}
        else if(q.state===2){q.state=0;q.grow=0;p.inv.crops++;sfx(700,.12,'triangle',.04);p.msg='Colheu 1 alimento!';p.msgT=120}
        return;
      }
    }
    if(Math.hypot(16*TS-p.px,6*TS-p.py)<56){
      p.day++;p.inv.seeds+=2;
      for(const q of p.plots)if(q.state===1){q.grow++;if(q.grow>=3)q.state=2}
      p.msg='Você dormiu. Dia '+p.day+' começou. +2 sementes.';p.msgT=200;sfx(400,.3,'sine',.04);
    }
  }
  if(jp(0,'b')){
    if(p.inv.crops>0){const v=p.inv.crops*12;town.coins+=v;G.p1.coins+=v;p.msg='Vendeu '+p.inv.crops+' alimentos por '+v+' ◆';p.inv.crops=0;p.msgT=180;sfx(800,.12,'triangle',.04);save()}
    else{p.msg='Sem alimentos para vender.';p.msgT=120}
  }
  G.town=town;
}
function townDraw(){
  if(!town)initTown();
  const p=town;
  X.fillStyle='#1a2e1c';X.fillRect(0,0,VW,VH);
  const camX=Math.max(0,Math.min(TW*TS-VW,p.px-VW/2));
  const camY=Math.max(0,Math.min(TH*TS-VH,p.py-VH/2));
  const x0=Math.floor(camX/TS),y0=Math.floor(camY/TS);
  for(let y=y0;y<y0+VH/TS+2&&y<TH;y++)for(let x=x0;x<x0+VW/TS+2&&x<TW;x++){
    const sx=x*TS-camX,sy=y*TS-camY;
    let c='#3c6b3a';
    if(x<3||y<2)c='#2a4a2a';
    if((x===16||x===17)&&y>5&&y<28)c='#8a7a5a';
    if(y===14&&x>3&&x<40)c='#8a7a5a';
    if(x>28&&x<34&&y>22&&y<27)c='#2a5a8a';
    if(x>=14&&x<=19&&y>=5&&y<=8)c='#6a4a2a';
    X.fillStyle=c;X.fillRect(sx,sy,TS,TS);
    if((x+y)%3===0&&c==='#3c6b3a'){X.fillStyle='#4a7a44';X.fillRect(sx+4,sy+4,TS-8,TS-8)}
  }
  X.fillStyle='#a03a2a';X.fillRect(14*TS-camX,5*TS-camY,6*TS,TS);
  X.fillStyle='#d9c0a0';X.fillRect(16*TS-camX,6*TS-camY,TS,TS*.7);
  X.fillStyle='#c05a4a';X.fillRect(16*TS-camX,6*TS-camY,TS,TS*.3);
  for(const q of p.plots){
    const sx=q.x-camX,sy=q.y-camY;
    X.fillStyle='#5a3a20';X.fillRect(sx-TS/2,sy-TS/2,TS,TS);
    X.strokeStyle='#3a2410';X.strokeRect(sx-TS/2,sy-TS/2,TS,TS);
    if(q.state===1){X.fillStyle='#4bd36e';X.beginPath();X.arc(sx,sy-2,3+q.grow*2,0,7);X.fill()}
    else if(q.state===2){X.fillStyle='#ffd76b';X.beginPath();X.arc(sx,sy-4,8,0,7);X.fill();
      X.fillStyle='#e0a030';X.beginPath();X.arc(sx,sy-4,4,0,7);X.fill()}
  }
  for(const n of p.npcs){
    const sx=n.x-camX,sy=n.y-camY,bob=Math.sin(T/14+n.x)*2;
    X.fillStyle='#0003';X.beginPath();X.ellipse(sx,sy+14,11,4,0,0,7);X.fill();
    X.fillStyle=n.c;X.fillRect(sx-7,sy-10+bob,14,20);
    X.fillStyle='#f0d8b8';X.beginPath();X.arc(sx,sy-16+bob,8,0,7);X.fill();
    X.fillStyle='#222';X.beginPath();X.arc(sx-3,sy-17+bob,1.5,0,7);X.arc(sx+3,sy-17+bob,1.5,0,7);X.fill();
    X.fillStyle='#e8f5e9';X.font='10px Georgia,serif';X.textAlign='center';
    X.fillText(n.n,sx,sy+26);
  }
  const sx=p.px-camX,sy=p.py-camY,bob=Math.sin(p.anim*6)*2;
  X.fillStyle='#0003';X.beginPath();X.ellipse(sx,sy+15,12,4,0,0,7);X.fill();
  X.fillStyle='#0a2a18';X.fillRect(sx-8,sy-12+bob,16,22);
  X.fillStyle='#4bd36e';X.fillRect(sx-6,sy-10+bob,12,18);
  X.fillStyle='#e8f5e9';X.beginPath();X.arc(sx,sy-18+bob,8,0,7);X.fill();
  X.fillStyle='#222';X.beginPath();X.arc(sx-3,sy-19+bob,1.5,0,7);X.arc(sx+3,sy-19+bob,1.5,0,7);X.fill();
  X.fillStyle='rgba(4,14,8,.75)';X.fillRect(0,0,VW,46);
  tx('VERDÁLIA RESTAURADA',20,30,18,'left',1,'#9ef0b0');
  tx('Dia '+p.day,VW/2,30,15,'center',.9);
  tx('◆ P1: '+G.p1.coins,VW-20,30,13,'right',1,'#ffd27a');
  tx('Sementes: '+p.inv.seeds+'    Alimentos: '+p.inv.crops,VW-20,64,12,'right',.8);
  tx('WASD/direcional mover   E/Z/A interagir·plantar·colher·dormir   B vender colheita   Esc título',VW/2,VH-18,12,'center',.6);
  if(p.msgT>0){
    const a=Math.min(1,p.msgT/30);
    X.fillStyle='rgba(0,0,0,'+.7*a+')';X.fillRect(VW/2-280,VH-110,560,54);
    X.strokeStyle='#4bd36e';X.lineWidth=1.5;X.strokeRect(VW/2-280,VH-110,560,54);
    wr(p.msg,VW/2,VH-84,540,14,20,a);
  }
}

function step(){
  T++;input();
  if(cf>0)cf--;if(tm>0)tm--;if(shake>0)shake*=.88;if(tSlow>0)tSlow--;
  updateMusic();
  wxStep();
  if(PS[0]&&(sc==='play'||sc==='pause'||sc==='shop'||sc==='map'))syncPlayers();
  if(sc==='title'){volKeys();titleStep();return}
  if(sc==='diff'){diffStep();return}
  if(sc==='story'){if(anyJp('e')||anyJp('a')||anyJp('j')){if(++pg>=sp.length)start(nx);else sndMenuConfirm()}return}
  if(sc==='msg'){if(anyJp('e')||anyJp('a')||anyJp('j')||anyJp('h'))advMsg();return}
  if(sc==='shop'){shopStep();return}
  if(sc==='map'){mapStep();return}
  if(sc==='pause'){pauseStep();return}
  if(sc==='end'){ec=Math.min(1,ec+.003);if(ec>=1&&(anyJp('e')||anyJp('a'))){initTown();sc='town'}return}
  if(sc==='town'){townStep();return}
  if(sc!=='play')return;
  if(anyJp('p')){sc='pause';pauseIdx=0;sndPause();return}
  for(let i=0;i<4;i++)if(PS[i]&&jp(i,'b')){shopOwner=i;ret='play';sc='shop';shopTab=0;shopIdx=0;sndMenuConfirm();return}
  if(anyJp('m')){openMap();return}
  if(tt>0)tt--;if(sbt>0)sbt--;if(fd>0)fd-=.03;
  for(let i=0;i<4;i++)upPlayer(PS[i],i);
  if(!(tSlow>0&&(T&1))){upClone();upEnemies();upBoss();upProj()}   /* Semente do Tempo: inimigos a meia velocidade */
  if(bd>0){
    bd--;
    if(bd%6===0){burst(bx+(Math.random()-.5)*120,by+(Math.random()-.5)*100,10,'#ffd27a',6);
      sfx(80+Math.random()*80,.1,'sawtooth',.07)}
    shake=6;
    if(bd===0){
      if(lv===1000){sc='end';ec=0;G.finished=1;save();return}
      const next=lv+1;
      msg={t:bossName(bk)+' foi derrotado!',a:REG_STORY[bk%10][3]+'\n\n'+THEMES[bk%10].n+' respira de novo.',
        u:'Recompensa: +'+(60+bk*4)+' ◆ (cada jogador)   ·   Próximo nível '+next};
      sc='msg';G.lv=next;save();return;
    }
  }
  {const al=PS.filter(q=>q&&q.hp>0);
   if(al.length>1)for(const q of al){
     const sx=q.x-cam;
     if(sx<-40||sx>VW+40){
       if(++q.offT>150){
         const ref=al.find(o=>o!==q&&o.x-cam>0&&o.x-cam<VW)||al.find(o=>o!==q);
         if(ref){q.x=ref.x;q.y=ref.y-10;q.vx=q.vy=0;q.inv=90;q.offT=0;burst(q.x,q.y,20,'#9ef0b0',5);toast('P'+(q.id+1)+' voltou ao grupo')}
       }
     }else q.offT=0;
   }}
  const alive=PS.filter(p=>p&&p.hp>0);
  if(alive.length===0){
    if(++dd>80){start(lv);dd=0}
  }else{
    dd=0;
    for(const p of PS){
      if(p&&p.hp<=0){
        const t=alive[0];
        p.hp=mhp(p.id);p.x=t.x;p.y=t.y;p.inv=120;
      }
    }
  }
  /* sai da fase quando todos chegam; se só alguns chegaram, espera 5s (um controle parado não trava mais o grupo) */
  const nEx=alive.filter(q=>q.x>LW-110).length;
  const exitOk=!isBoss(lv)&&!(cg&&en.length)&&nEx>0;
  if(exitOk&&nEx<alive.length)exitT++;else exitT=0;
  if(exitOk&&(nEx===alive.length||exitT>=300)){
    exitT=0;
    sfx(660,.3,'sine');gain(20+(cg?30:0));inc('l',1);
    for(const p of PS)if(p)addCh(p,30);
    if(cg)inc('c',1);
    G.lv=lv+1;save();
    checkPowers();
    if(sc!=='msg')start(lv+1);
  }
  const r=isBoss(lv)?(bd>0?1:.2):(Math.max(...alive.map(q=>q.x),0)/LW);
  cura=(lv-1+Math.min(1,Math.max(0,r)))/1000;
  let midX=pl.x;
  if(alive.length>0)midX=alive.reduce((s,p)=>s+p.x,0)/alive.length;
  cam+=(Math.max(0,Math.min(LW-VW,midX-VW/2))-cam)*.12;
}
function advMsg(){
  const prevMsg=msg;
  checkPowers();
  if(msg!==prevMsg){sndMenuConfirm();return;}
  const n=G.lv||lv+1;
  if(n%10===1&&n<=1000){
    const reg=Math.floor((n-1)/100)%10;
    sc='story';sp=[REG_STORY[reg][0],REG_STORY[reg][1]];pg=0;nx=n;
  }else start(n);
  sndMenuConfirm();
}
function shopStep(){
  const pr=shopProfile();
  const L=shopList(shopTab);
  const inp=shopOwner;
  if(jp(inp,'b')||jp(inp,'p')||jp(inp,'h')){sc=ret||'play';sndMenuBack();return}
  if(jp(inp,'v')||jp(inp,'g')){shopTab=(shopTab+TABS.length-1)%TABS.length;shopIdx=0;sndMenuMove();}
  if(jp(inp,'u')){shopTab=(shopTab+1)%TABS.length;shopIdx=0;sndMenuMove();}
  if(jp(inp,'t')){shopTab=(shopTab+TABS.length-1)%TABS.length;shopIdx=0;sndMenuMove();}
  if(jp(inp,'y')||jp(inp,'s')){shopTab=(shopTab+1)%TABS.length;shopIdx=0;sndMenuMove();}
  if(jp(inp,'l')){const ni=Math.max(0,shopIdx-1);if(ni!==shopIdx)sndMenuMove();shopIdx=ni;}
  if(jp(inp,'r')){const ni=Math.min(L.length-1,shopIdx+1);if(ni!==shopIdx)sndMenuMove();shopIdx=ni;}
  if(jp(inp,'mu')){const ni=Math.max(0,shopIdx-COLS);if(ni!==shopIdx)sndMenuMove();shopIdx=ni;}
  if(jp(inp,'dn')){const ni=Math.min(L.length-1,shopIdx+COLS);if(ni!==shopIdx)sndMenuMove();shopIdx=ni;}
  if(dn(inp,'l')&&T%6===0)shopIdx=Math.max(0,shopIdx-1);
  if(dn(inp,'r')&&T%6===0)shopIdx=Math.min(L.length-1,shopIdx+1);
  if(dn(inp,'mu')&&T%5===0)shopIdx=Math.max(0,shopIdx-COLS);
  if(dn(inp,'dn')&&T%5===0)shopIdx=Math.min(L.length-1,shopIdx+COLS);
  if(jp(inp,'e')||jp(inp,'a'))buyItem(L[shopIdx]);
}

function draw(){
  cv=sc==='end'?ec:Math.pow(Math.min(1,cura),.75);
  if(sc==='title'||sc==='story'||sc==='diff'||sc==='town')cv=.35;
  X.setTransform(S,0,0,S,0,0);X.globalAlpha=1;
  if(sc==='town'){townDraw();return}
  bg();
  X.save();
  X.translate(-cam+(Math.random()-.5)*shake,(Math.random()-.5)*shake);
  world();X.restore();
  for(let i=0;i<60;i++){
    const a={x:(i*137.5+cam*.3)%VW,y:(i*89.7+T*.4)%VH};
    X.globalCompositeOperation='lighter';
    if(cv>.3){X.fillStyle=`hsla(${50+(i%5)*5},90%,65%,${.4+Math.sin(T/20+i)*.3})`;
      X.beginPath();X.arc(a.x,a.y,1.4,0,7);X.fill()}
    X.globalCompositeOperation='source-over';
  }
  wxDraw();
  const v=X.createRadialGradient(VW/2,VH/2,VH*.35,VW/2,VH/2,VH*1.05);
  v.addColorStop(0,'rgba(0,0,0,0)');
  v.addColorStop(1,`rgba(0,0,0,${.3-cv*.18})`);
  X.fillStyle=v;X.fillRect(0,0,VW,VH);
  if(sc==='play')hudPlay();
  else if(sc==='shop')shopDraw();
  else if(sc==='map')mapDraw();
  else if(sc==='pause')pauseDraw();
  else if(sc==='title')titleDraw();
  else if(sc==='diff')diffDraw();
  else if(sc==='story')storyDraw();
  else if(sc==='msg')msgDraw();
  else if(sc==='end')endDraw();
  if(sc!=='play'&&tm>0)tx(tms,VW/2,VH-70,17,'center',Math.min(1,tm/30),'#ffe9a8');
}

let last=0,acc=0;
function loop(t){
  requestAnimationFrame(loop);
  acc+=Math.min(t-last,100);last=t;
  while(acc>=16.67){acc-=16.67;if(hs>0)hs--;else step()}
  musicStep();
  draw();
}
if(G.diff<0)sc='title';
requestAnimationFrame(loop);
</script>
